name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
    - main
    - 'releases/*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Run plugin check
      uses: wordpress/plugin-check-action@v1
      with:
        exclude-directories: 'docs,.agents,.claude,.github,.interface-design,openspec,bin,tests'
        exclude-files: 'CLAUDE.md,SECURITY.md,skills-lock.json,.gitignore,.wp-env.json,composer.json,composer.lock,phpunit.xml.dist'

  phpunit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # Same command as local dev — see openspec/changes/testing-infrastructure/design.md
    # (Decision 5): wp-env start, openldap-test, PHPUnit (unit/wp/ldap testsuites).
    - name: Run test suite
      run: bash bin/test.sh
